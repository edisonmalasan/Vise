[package]
name = "vise-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Command-line interface for the Vise media transcoder."

[[bin]]
name = "vise"
path = "src/main.rs"

[[bin]]
name = "vise-cli"
path = "src/main.rs"

[dependencies]
vise-core = { path = "../vise-core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"