[package]
name = "vise-desktop"
version = "0.1.0"
description = "Vise Transcoder desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vise-core = { path = "../../../crates/vise-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
