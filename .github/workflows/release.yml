# Build a release on every platform we ship.
#
# Each platform builds in the environment it will run in, because the desktop
# window needs a webview toolkit and native libraries that cannot be carried
# across: a Windows build made on Linux would link against the wrong libraries,
# and a macOS build needs the macOS frameworks.
#
# The artifacts are uploaded rather than published. Publishing is a separate,
# deliberate step, so a green run cannot put something in front of a user by
# itself.

name: release

on:
  workflow_dispatch:
    inputs:
      bundled:
        description: Fetch and bundle the pinned media tools
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Tauri CLI is invoked through cargo, so it is installed once per job.
  TAURI_CLI_VERSION: "^2"

jobs:
  check:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: the libraries the window renders through
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file curl ca-certificates \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev ffmpeg
      - name: formatting
        run: cargo fmt --all -- --check
      - name: lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  linux:
    name: linux package
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/vise-desktop/src-tauri -> target
      - name: the libraries the window renders through
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev fakeroot dpkg-dev desktop-file-utils
      - name: build
        run: |
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          ./scripts/fetch-media-tools.sh linux-x86_64
          ./scripts/verify-media-tools.sh linux-x86_64
          cargo build --workspace --release
          mkdir -p apps/vise-desktop/src-tauri/vendor/sidecar
          cp target/release/vise-worker apps/vise-desktop/src-tauri/vendor/sidecar/vise-worker
          cd apps/vise-desktop/src-tauri && cargo tauri bundle --bundles deb,appimage
      - name: check the package
        run: ./scripts/check-linux-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  windows:
    name: windows installer
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/vise-desktop/src-tauri -> target
      - name: build
        shell: bash
        run: |
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          ./scripts/fetch-media-tools.sh windows-x86_64
          ./scripts/verify-media-tools.sh windows-x86_64
          cargo build --workspace --release
          mkdir -p apps/vise-desktop/src-tauri/vendor/sidecar
          cp target/release/vise-worker.exe apps/vise-desktop/src-tauri/vendor/sidecar/vise-worker.exe
          cd apps/vise-desktop/src-tauri && cargo tauri bundle --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*.exe

  macos:
    name: macos bundle
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/vise-desktop/src-tauri -> target
      - name: build
        run: |
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          ./scripts/fetch-media-tools.sh darwin-x86_64
          ./scripts/verify-media-tools.sh darwin-x86_64
          cargo build --workspace --release
          mkdir -p apps/vise-desktop/src-tauri/vendor/sidecar
          cp target/release/vise-worker apps/vise-desktop/src-tauri/vendor/sidecar/vise-worker
          cd apps/vise-desktop/src-tauri && cargo tauri bundle --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg

  # The release is cut from the artifacts the three builds produced, so what
  # is published is exactly what was built and checked rather than a second
  # build that might differ. The job runs only for a tag: a plain run builds
  # and stops there, and nothing reaches a user until the tag is pushed.
  publish:
    name: publish the release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/release-notes.sh "$version" > "notes-$version.md"
          echo "publish: the notes for $version"
          head -20 "notes-$version.md"
      - name: the files to publish
        run: |
          mkdir -p publish
          # A space in a file name becomes a dot when GitHub stores the asset,
          # so the name is changed here rather than after the fact: a checksum
          # file that names a file the release does not have is a checksum file
          # that fails, and "sha256sum -c" is exactly what a person runs.
          find artifacts -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec bash -c 'for file; do cp "$file" "publish/$(basename "${file// /.}")"; done' _ {} +
          echo "publish: the files that will be published"
          ls -la publish
      - name: the checksums
        run: |
          cd publish
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Vise Transcoder $version" \
            --notes-file "notes-$version.md" \
            publish/*
          echo "publish: https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME"